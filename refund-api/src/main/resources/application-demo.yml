lab:
  demo-identities-enabled: true
spring:
  datasource:
    url: jdbc:postgresql://localhost:5438/refund_lab
    username: refund
    password: refund
  ai:
    chat:
      client:
        tool-calling:
          enabled: true
    mcp:
      client:
        enabled: true
        name: refund-management-host
        type: SYNC
        request-timeout: 10s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            refund-policies:
              url: http://127.0.0.1:8081
              endpoint: /mcp
    tools:
      throw-exception-on-error: true
      resolution:
        fallback:
          enabled: false
      limits:
        max-calls-per-tool-default: 3
        max-total-tool-calls: 6
        on-limit-exceeded: THROW
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
        options:
          temperature: 0.1
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        remove-existing-vector-store-table: false
